syntax = "proto3";

import "google/protobuf/empty.proto";

package grpcIMapProcessingPipeline;

message initRequest
{
int32 grpcServerCompressionFormat  = 1;
}

message initResponse
{
sint32 xpcfGrpcReturnValue = 1;
}

message startRequest
{
int32 grpcServerCompressionFormat  = 1;
}

message startResponse
{
sint32 xpcfGrpcReturnValue = 1;
}

message stopRequest
{
int32 grpcServerCompressionFormat  = 1;
}

message stopResponse
{
sint32 xpcfGrpcReturnValue = 1;
}

message setMapToProcess_grpc0Request
{
int32 grpcServerCompressionFormat  = 1;
bytes map = 2;
}

message setMapToProcess_grpc0Response
{
sint32 xpcfGrpcReturnValue = 1;
}

message setMapToProcess_grpc1Request
{
int32 grpcServerCompressionFormat  = 1;
string mapUUID = 2;
string resultMapUUID = 3;
}

message setMapToProcess_grpc1Response
{
sint32 xpcfGrpcReturnValue = 1;
}

message getStatusRequest
{
int32 grpcServerCompressionFormat  = 1;
sint32 status = 2;
float progress = 3;
}

message getStatusResponse
{
sint32 status = 1;
float progress = 2;
sint32 xpcfGrpcReturnValue = 3;
}

message getProcessingDataRequest
{
int32 grpcServerCompressionFormat  = 1;
bytes pointCloud = 2;
bytes keyframePoses = 3;
}

message getProcessingDataResponse
{
bytes pointCloud = 1;
bytes keyframePoses = 2;
sint32 xpcfGrpcReturnValue = 3;
}

message getProcessedMapRequest
{
int32 grpcServerCompressionFormat  = 1;
bytes map = 2;
}

message getProcessedMapResponse
{
bytes map = 1;
sint32 xpcfGrpcReturnValue = 2;
}

service grpcIMapProcessingPipelineService {
rpc init(initRequest) returns(initResponse) {}
rpc start(startRequest) returns(startResponse) {}
rpc stop(stopRequest) returns(stopResponse) {}
rpc setMapToProcess_grpc0(setMapToProcess_grpc0Request) returns(setMapToProcess_grpc0Response) {}
rpc setMapToProcess_grpc1(setMapToProcess_grpc1Request) returns(setMapToProcess_grpc1Response) {}
rpc getStatus(getStatusRequest) returns(getStatusResponse) {}
rpc getProcessingData(getProcessingDataRequest) returns(getProcessingDataResponse) {}
rpc getProcessedMap(getProcessedMapRequest) returns(getProcessedMapResponse) {}
}

