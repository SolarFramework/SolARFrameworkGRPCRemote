syntax = "proto3";

import "google/protobuf/empty.proto";

package grpcIMapExportImportPipeline;

message initRequest
{
int32 grpcServerCompressionFormat  = 1;
}

message initResponse
{
sint32 xpcfGrpcReturnValue = 1;
}

message startRequest
{
int32 grpcServerCompressionFormat  = 1;
}

message startResponse
{
sint32 xpcfGrpcReturnValue = 1;
}

message stopRequest
{
int32 grpcServerCompressionFormat  = 1;
}

message stopResponse
{
sint32 xpcfGrpcReturnValue = 1;
}

message exportMapRequest
{
int32 grpcServerCompressionFormat  = 1;
string mapUUID = 2;
bytes compressedZipExport = 3;
}

message exportMapResponse
{
bytes compressedZipExport = 1;
sint32 xpcfGrpcReturnValue = 2;
}

message importMapRequest
{
int32 grpcServerCompressionFormat  = 1;
string mapUUID = 2;
bytes compressedZipImport = 3;
}

message importMapResponse
{
sint32 xpcfGrpcReturnValue = 1;
}

service grpcIMapExportImportPipelineService {
rpc init(initRequest) returns(initResponse) {}
rpc start(startRequest) returns(startResponse) {}
rpc stop(stopRequest) returns(stopResponse) {}
rpc exportMap(exportMapRequest) returns(exportMapResponse) {}
rpc importMap(importMapRequest) returns(importMapResponse) {}
}

